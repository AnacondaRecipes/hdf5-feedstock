{% set name = "hdf5" %}
{% set version = "2.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/HDFGroup/{{ name }}/releases/download/{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1a1ab8209b35586fbc1aa279ba76d102130b95badcb20ca329587219112d8c16
  patches:
    # Backport the ROS3 static dependency fix from https://github.com/HDFGroup/hdf5/pull/6617.
    # Static libraries are only built on Unix.
    - patches/0001-fix-static-ros3-cmake-dependency.patch  # [unix]

build:
  number: 0
  run_exports:
    # hdf5 has historically broken API between bugfix revisions.  Pin it to be safe.
    #    This pinning is using the implicitly defined output for the top-level recipe.
    #    We use pin_subpackage here so that we have more control over the pinning.
    - {{ pin_subpackage('hdf5', min_pin='x.x.x', max_pin='x.x.x') }}

requirements:
  build:
    - {{ stdlib('c')}}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - make  # [linux]
    - cmake
    - pkg-config
  host:
    - libgfortran5 14.3.0     # [unix]
    - libcurl  {{ libcurl }}  # [unix]
    - openssl  {{ openssl }}  # [unix]
    - aws-c-auth {{ aws_c_auth }}
    - aws-c-common {{ aws_c_common }}
    - aws-c-http {{ aws_c_http }}
    - aws-c-io {{ aws_c_io }}
    - aws-c-s3 {{ aws_c_s3 }}
    - aws-c-sdkutils {{ aws_c_sdkutils }}
    - libzlib  {{ libzlib }}
  run:
    - openssl 3.*  # [unix]
    # The h5cc, h5c++ and h5fc wrappers call pkg-config unconditionally (https://github.com/HDFGroup/hdf5/blob/2.2.0/config/libh5cc.in#L232-L236).
    - pkg-config   # [unix]

# no explicit run deps.  zlib is one, and C/C++/Fortran runtimes are others, but these are taken care of
#   with conda-build 3's run_exports in those packages.  They will be run reqs in the final package.  See
#   for yourself by running conda render on this recipe.

test:
  requires:
    - compilers
    - cmake  # [unix]
    - make   # [unix]
  files:
    - tests/CMakeLists.txt  # [unix]
    - h5_cmprss.c
    - h5tutr_cmprss.cpp
    - h5_cmprss.f90
    - compound_fortran2003.f90
  commands:
    # Verify UNIX CLI tools.
    {% set hdf5_unix_cmds = [
        "h5c++",
        "h5cc",
        "h5perf_serial",
        "h5fc"
    ] %}
    {% for each_hdf5_unix_cmd in hdf5_unix_cmds %}
    - command -v {{ each_hdf5_unix_cmd }}   # [unix]
    {% endfor %}

    # Verify CLI tools.
    {% set hdf5_cmds = [
        "h5copy",
        "h5debug",
        "h5diff",
        "h5dump",
        "h5import",
        "h5jam",
        "h5ls",
        "h5mkgrp",
        "h5repack",
        "h5repart",
        "h5stat",
        "h5unjam"
    ] %}
    {% for each_hdf5_cmd in hdf5_cmds %}
    - command -v {{ each_hdf5_cmd }}        # [unix]
    - where {{ each_hdf5_cmd }}             # [win]
    {% endfor %}
    - h5dump --version  # [win]
    - h5ls --version    # [win]

    # Verify libraries.
    {% set hdf5_libs = [
        "hdf5",
        "hdf5_cpp",
        "hdf5_hl",
        "hdf5_hl_cpp",
    ] %}
    {% for each_hdf5_lib in hdf5_libs %}
    - test -f $PREFIX/lib/lib{{ each_hdf5_lib }}.a                           # [unix]
    - test -f $PREFIX/lib/lib{{ each_hdf5_lib }}${SHLIB_EXT}                 # [unix]
    - if not exist %PREFIX%\\Library\\lib\\{{ each_hdf5_lib }}.lib exit 1    # [win]
    - if not exist %PREFIX%\\Library\\bin\\{{ each_hdf5_lib }}.dll exit 1    # [win]
    {% endfor %}

    # Inspect linkages of HDF5.
    {% for each_hdf5_lib in hdf5_libs %}
    - otool -L $PREFIX/lib/lib{{ each_hdf5_lib }}.dylib                      # [osx]
    {% endfor %}

    # Test C compiler
    - echo "Testing h5cc"            # [unix]
    - h5cc -show                     # [unix]
    - h5cc h5_cmprss.c -o h5_cmprss  # [unix]
    - export LD_LIBRARY_PATH=$PREFIX/lib:$LD_LIBRARY_PATH      # [linux]
    - ./h5_cmprss                    # [unix]

    # Test C++ compiler
    - echo "Testing h5c++"                      # [unix]
    - h5c++ -show                               # [unix]
    - h5c++ h5tutr_cmprss.cpp -o h5tutr_cmprss  # [unix]
    - ./h5tutr_cmprss                           # [unix]

    # Test Fortran 90 compiler
    - echo "Testing h5fc"              # [unix]
    - h5fc -show                       # [unix]
    - h5fc h5_cmprss.f90 -o h5_cmprss  # [unix]
    - ./h5_cmprss                      # [unix]

    # Test Fortran 2003 compiler, note that the file has a 90 extension
    - echo "Testing h5fc for Fortran 2003"                   # [unix]
    - h5fc compound_fortran2003.f90 -o compound_fortran2003  # [unix]
    - ./compound_fortran2003                                 # [unix]

    # Test the static library through the installed CMake package.
    - cmake -S tests -B cmake-build -D CMAKE_PREFIX_PATH="$PREFIX"  # [unix]
    - cmake --build cmake-build                                 # [unix]
    - ./cmake-build/hdf5_static_consumer                        # [unix]

about:
  home: https://www.hdfgroup.org/solutions/hdf5
  license: BSD-3-Clause AND BSD-1-Clause
  license_file: LICENSE
  license_family: BSD
  summary: HDF5 is a data model, library, and file format for storing and managing data
  description: |
    HDF5 supports an unlimited variety of datatypes, and is designed for
    flexible and efficient I/O and for high volume and complex data.
  doc_url: https://support.hdfgroup.org/documentation/index.html
  dev_url: https://github.com/HDFGroup/hdf5

extra:
  recipe-maintainers:
    - jakirkham
    - gillins
    - groutr
    - ocefpaf
    - astrofrog
    - marqh
    - msarahan
